<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f3ef" />
    <title>cranklink — Drive Unit Field Instrument</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script src="./coi-serviceworker.js"></script>
    <link rel="stylesheet" href="./css/instrument.css" />
  </head>
  <body>
    <cranklink-instrument id="instrument-root"></cranklink-instrument>

    <!-- Hidden host elements used by the underlying WASM/GATT/USB bridge (app.js) -->
    <div style="display: none" aria-hidden="true">
      <pre id="output" role="log"></pre>
      <form id="command-form" autocomplete="off">
        <input id="command" type="text" disabled />
      </form>
      <input id="file-picker" type="file" multiple />
    </div>

    <!-- Native Bluetooth 6-digit Passkey Dialog -->
    <dialog id="ble-passkey-dialog" aria-labelledby="ble-passkey-title" aria-describedby="ble-passkey-help">
      <form method="dialog">
        <h2 id="ble-passkey-title">Bluetooth passkey</h2>
        <p id="ble-passkey-help">
          Enter the 6-digit passkey for the Shimano E-TUBE Bluetooth gateway.
        </p>
        <label for="ble-passkey">Passkey</label>
        <input
          id="ble-passkey"
          type="password"
          inputmode="numeric"
          pattern="[0-9]{6}"
          minlength="6"
          maxlength="6"
          autocomplete="off"
          required
        />
        <div class="ble-passkey-actions">
          <button id="ble-passkey-cancel" type="button">Cancel</button>
          <button type="submit" value="authenticate">Authenticate</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
