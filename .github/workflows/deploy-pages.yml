name: Validate & Deploy Web Instrument

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'web-instrument/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/scripts/check-web-assets.py'
      - '.github/scripts/serve-web-build.py'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'web-instrument/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/scripts/check-web-assets.py'
      - '.github/scripts/serve-web-build.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test production web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build fresh WebAssembly runtime
        run: |
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME=/build-home" \
            cargo build --release --locked --target wasm32-unknown-unknown --lib
          # wasm-bindgen must never inherit a local package's documentation or binary.
          rm -rf web-instrument/pkg
          mkdir web-instrument/pkg
          wasm-bindgen target/wasm32-unknown-unknown/release/cranklink.wasm \
            --out-dir web-instrument/pkg --target web
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-instrument/package-lock.json
      - name: Test and build web instrument
        working-directory: web-instrument
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify production asset contents
        run: python3 .github/scripts/check-web-assets.py web-instrument/dist
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web-instrument/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium for production smoke tests
        working-directory: web-instrument
        run: npx playwright install --with-deps chromium
      - name: Verify Pages subpath, service-worker isolation and WASM settings workflow
        working-directory: web-instrument
        # Uses the exact dist behind a headerless /cranklink/ static server.
        # A development server with COOP/COEP headers would conceal hosting bugs.
        run: npm run test:production
      - name: Upload verified Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-instrument/dist

  deploy:
    name: Deploy verified artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify existing Pages configuration
        uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
