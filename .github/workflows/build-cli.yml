name: Build & Release CLI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux default and BLE tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Test default CLI and core
        run: cargo test --locked --lib --bin cranklink
      - name: Test BLE CLI and core
        run: cargo test --locked --features ble --lib --bin cranklink

  build:
    name: Build on Linux (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            binary: cranklink
            archive: cranklink-linux-x86_64.tar.gz
          - target: aarch64-apple-darwin
            binary: cranklink
            archive: cranklink-macos-arm64.tar.gz
          - target: x86_64-apple-darwin
            binary: cranklink
            archive: cranklink-macos-x86_64.tar.gz
          - target: x86_64-pc-windows-gnu
            binary: cranklink.exe
            archive: cranklink-windows-x86_64.zip
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - name: Install MinGW cross compiler
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64 zip
      - name: Build Linux or Windows release CLI with BLE
        if: ${{ !contains(matrix.target, 'apple-darwin') }}
        run: cargo build --release --locked --target ${{ matrix.target }} --features ble --bin cranklink
      - name: Cross-build macOS CLI with BLE using official SDK image
        if: contains(matrix.target, 'apple-darwin')
        env:
          # Official cargo-zigbuild 0.23.4 linux/amd64 image includes MacOSX11.3.sdk.
          # Override its Zig 0.16: that linker misparses Rust exported-symbol flags.
          ZIGBUILD_IMAGE: ghcr.io/rust-cross/cargo-zigbuild@sha256:9b4f6b3eb9e8f9fefb3960fe288ddba576627d66d9eff851ce7f62d2455564a5
        run: |
          # Stable Zig 0.13 handles the cdylib export list generated while Cargo
          # builds this crate's rlib dependency, even with --bin cranklink.
          curl --fail --location --proto '=https' --proto-redir '=https' \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          printf '%s  %s\n' d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea "$RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig-stable"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig-stable" --strip-components=1
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$RUNNER_TEMP/zig-stable:/opt/zig-stable:ro" \
            --volume "${RUSTUP_HOME:-$HOME/.rustup}:/usr/local/rustup:ro" \
            --workdir /work \
            --env CARGO_HOME=/tmp/cargo \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env ZIG_GLOBAL_CACHE_DIR=/tmp/zig-global \
            --env ZIG_LOCAL_CACHE_DIR=/tmp/zig-local \
            --env MACOSX_DEPLOYMENT_TARGET=11.0 \
            --env CARGO_ZIGBUILD_ZIG_COMMAND=/opt/zig-stable/zig \
            "$ZIGBUILD_IMAGE" \
            cargo +1.90.0 zigbuild --release --locked --target "${{ matrix.target }}" --features ble --bin cranklink
          file "target/${{ matrix.target }}/release/cranklink" | tee macos-binary.txt
          grep 'Mach-O' macos-binary.txt
          echo 'macOS cross-build uses the official cargo-zigbuild SDK image on Linux. Execution and BLE hardware require separate macOS validation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test native Linux executable
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          target/${{ matrix.target }}/release/cranklink --version
          target/${{ matrix.target }}/release/cranklink --help
      - name: Inspect Windows executable dependencies
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          x86_64-w64-mingw32-objdump -p "target/${{ matrix.target }}/release/cranklink.exe" > windows-imports.txt
          grep 'DLL Name:' windows-imports.txt
          # These DLLs would need packaging; fail rather than ship an incomplete archive.
          if grep -Ei 'DLL Name:.*(libgcc|libstdc\+\+|libwinpthread)' windows-imports.txt; then
            echo 'Unexpected MinGW runtime DLL dependency' >&2
            exit 1
          fi
          echo 'Windows GNU cross-build succeeded; Windows runtime and BLE hardware are not exercised by Linux CI.' >> "$GITHUB_STEP_SUMMARY"
      - name: Package binary and license
        run: |
          mkdir -p package dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" LICENSE package/
          if [[ '${{ matrix.target }}' == 'x86_64-pc-windows-gnu' ]]; then
            (cd package && zip ../dist/${{ matrix.archive }} cranklink.exe LICENSE)
          else
            tar -czf "dist/${{ matrix.archive }}" -C package cranklink LICENSE
          fi
          cd dist
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          sha256sum -c "${{ matrix.archive }}.sha256"
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Verify release checksums and platform completeness
        run: |
          cd dist
          for archive in cranklink-linux-x86_64.tar.gz cranklink-macos-arm64.tar.gz cranklink-macos-x86_64.tar.gz cranklink-windows-x86_64.zip; do
            test -s "$archive"
            sha256sum -c "$archive.sha256"
          done
          echo 'Release includes Linux, macOS ARM/Intel, and Windows GNU. All are built on Linux; macOS/Windows execution and BLE hardware require separate platform validation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
