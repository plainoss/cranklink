# Cloudflare Workers Builds deploys previews and production; this workflow
# gates merges on the same build, asset and production-browser checks.
name: Validate Web Instrument

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test production web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check changed paths
        id: filter
        run: python3 .github/scripts/check-changed-paths.py web
      - uses: dtolnay/rust-toolchain@1.90.0
        if: steps.filter.outputs.has_changes == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.has_changes == 'true'
        with:
          key: wasm
      - name: Install matching wasm-bindgen CLI
        if: steps.filter.outputs.has_changes == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build fresh WebAssembly runtime
        if: steps.filter.outputs.has_changes == 'true'
        run: |
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME=/build-home" \
            cargo build --release --locked --target wasm32-unknown-unknown --lib
          # wasm-bindgen must never inherit a local package's documentation or binary.
          rm -rf web-instrument/pkg
          mkdir web-instrument/pkg
          wasm-bindgen target/wasm32-unknown-unknown/release/cranklink.wasm \
            --out-dir web-instrument/pkg --target web
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.has_changes == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-instrument/package-lock.json
      - name: Test and build web instrument
        if: steps.filter.outputs.has_changes == 'true'
        working-directory: web-instrument
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify production asset contents
        if: steps.filter.outputs.has_changes == 'true'
        run: python3 .github/scripts/check-web-assets.py web-instrument/dist
      - name: Cache Playwright browser binaries
        if: steps.filter.outputs.has_changes == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web-instrument/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium for production smoke tests
        if: steps.filter.outputs.has_changes == 'true'
        working-directory: web-instrument
        run: npx playwright install --with-deps chromium
      - name: Verify _headers isolation and WASM startup on the production build
        if: steps.filter.outputs.has_changes == 'true'
        working-directory: web-instrument
        # Serves the exact dist with only the headers its _headers file declares,
        # as Cloudflare Workers static assets do.
        run: npm run test:production
      - name: Log skip summary
        if: steps.filter.outputs.has_changes != 'true'
        run: echo "No web or core changes detected; skipped WebAssembly compilation and web tests." >> "$GITHUB_STEP_SUMMARY"
