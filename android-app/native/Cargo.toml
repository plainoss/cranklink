[package]
name = "cranklink-android"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "cranklink_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
cranklink = { path = "../..", default-features = false }
hex = "0.4"
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
